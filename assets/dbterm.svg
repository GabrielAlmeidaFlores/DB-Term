<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title description">
  <title id="title">DB-Term</title>
  <desc id="description">A minimal neon database</desc>
  <defs>
    <style>
      .wordmark { fill: #172554; }
      .tagline { fill: #475569; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #f3f5ff; }
        .tagline { fill: #b7c2df; }
      }
    </style>
    <linearGradient id="canvas" x1="24" y1="18" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141a36"/>
      <stop offset="1" stop-color="#080b18"/>
    </linearGradient>
    <linearGradient id="neon" x1="95" y1="61" x2="151" y2="181" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72f4ff"/>
      <stop offset=".55" stop-color="#897cff"/>
      <stop offset="1" stop-color="#68f2bb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="12" y="12" width="216" height="216" rx="52" fill="url(#canvas)"/>
  <rect x="13" y="13" width="214" height="214" rx="51" fill="none" stroke="#8c7bff" stroke-opacity=".45" stroke-width="2"/>
  <ellipse cx="120" cy="76" rx="40" ry="15" fill="none" stroke="url(#neon)" stroke-width="7" filter="url(#glow)"/>
  <path d="M80 76v79c0 9 18 15 40 15s40-6 40-15V76" fill="none" stroke="url(#neon)" stroke-linejoin="round" stroke-width="7"/>
  <path d="M80 115c0 9 18 15 40 15s40-6 40-15M80 155c0 9 18 15 40 15s40-6 40-15" fill="none" stroke="url(#neon)" stroke-width="7"/>
  <circle cx="120" cy="194" r="5" fill="#68f2bb" filter="url(#glow)"/>
  <text class="wordmark" x="266" y="113" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">DB-Term</text>
  <text class="tagline" x="269" y="156" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="1">DATABASE WORKFLOW, IN YOUR TERMINAL</text>
</svg>
